# Baut das Spiel bei jedem Push auf "main" und veröffentlicht es auf GitHub Pages.
name: Veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - name: Dateiliste für eingebundene Seiten (z. B. wildhunt.com.de/sturmkrone)
        run: |
          node -e "
          const fs = require('fs'), path = require('path'), crypto = require('crypto');
          const root = 'dist', out = [];
          (function walk(d) { for (const n of fs.readdirSync(d)) { const p = path.join(d, n); fs.statSync(p).isDirectory() ? walk(p) : out.push(p); } })(root);
          const files = out.map(p => ({ path: path.relative(root, p).split(path.sep).join('/'), size: fs.statSync(p).size,
            sha256: crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex') }));
          fs.writeFileSync(path.join(root, 'build-files.json'), JSON.stringify({ version: require('./package.json').version,
            commit: process.env.GITHUB_SHA, built: new Date().toISOString(), base: process.env.BASE_PATH, files }, null, 1));
          "
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
