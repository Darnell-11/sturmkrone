# Baut die App-Dateien (PC: Sturmkrone-Setup.exe, Android: Sturmkrone.apk) und stellt sie als Download bereit:
# https://github.com/Darnell-11/sturmkrone/releases/latest
# Die Apps laden das Spiel von der Webseite – neu gebaut werden müssen sie nur, wenn sich etwas in app/ ändert.
name: App-Dateien

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/app.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/desktop/package-lock.json
      - run: npm ci
      - run: npx electron-builder --win nsis --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: app/desktop/dist/Sturmkrone-Setup.exe

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Ohne hinterlegten Schlüssel wird die Android-App nicht hier gebaut, sondern am PC gebaut und von Hand hochgeladen
      - name: Signaturschlüssel bereitstellen
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::notice::Kein Android-Schlüssel hinterlegt – die Android-App wird von Hand hochgeladen."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/sturmkrone.keystore"
          echo "ok=true" >> "$GITHUB_OUTPUT"
      - name: APK bauen
        if: steps.key.outputs.ok == 'true'
        env:
          STURMKRONE_KEYSTORE: ${{ runner.temp }}/sturmkrone.keystore
          STURMKRONE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/Sturmkrone.apk"
      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.ok == 'true'
        with:
          name: android
          path: ${{ runner.temp }}/Sturmkrone.apk

  release:
    needs: [windows, android]
    # Die PC-App erscheint auch dann, wenn der Android-Build einmal scheitert
    if: ${{ !cancelled() && needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: app
          name: Sturmkrone – App für PC und Android
          make_latest: true
          fail_on_unmatched_files: false
          files: |
            out/Sturmkrone-Setup.exe
            out/Sturmkrone.apk
          body: |
            **Sturmkrone als App** – dasselbe Spiel wie auf https://darnell-11.github.io/sturmkrone/, aktualisiert sich selbst und läuft nach dem ersten Start auch ohne Internet.

            **PC (Windows):** `Sturmkrone-Setup.exe` laden und doppelklicken. Sturmkrone installiert sich in Sekunden und legt ein Symbol auf den Desktop. Zeigt Windows „Der Computer wurde durch Windows geschützt“: auf „Weitere Informationen“ → „Trotzdem ausführen“ klicken.

            **Android:** `Sturmkrone.apk` auf dem Handy laden, öffnen und auf „Installieren“ tippen. Fragt das Handy nach, einmal „Apps aus dieser Quelle installieren“ erlauben.

            **iPhone/iPad:** Das Spiel in Safari öffnen → Teilen → „Zum Home-Bildschirm“.
