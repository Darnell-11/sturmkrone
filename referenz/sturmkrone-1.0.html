<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sturmkrone – Saga</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;0,800;1,800&display=swap" rel="stylesheet">
<style>
:root{
  --panel:#F3E6C8; --ink:#2B2118; --muted:#6E5A40; --brass:#A8701F; --seal:#A8322A; --teal:#1F7A8C; --ok:#3E7A33;
  --line:rgba(43,33,24,.22); --hudbg:rgba(243,230,200,.9); --on-brass:#FFF8E8;
  --sky:#3A8FD8; --horizon:#D8F1FF; --sea-deep:#0E6F93; --sea-shallow:#33C4D2; --foam:#FFFFFF; --sand:#F1D9A0; --grass:#6DBB4C; --leaf:#3F9A3A;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --panel:#12243C; --ink:#F1E4C6; --muted:#A9B4C2; --brass:#E3B04B; --seal:#E0654F; --teal:#5CC6CF; --ok:#7CC46A;
    --line:rgba(241,228,198,.2); --hudbg:rgba(18,36,60,.9); --on-brass:#12243C;
    --sky:#050B1F; --horizon:#1C3058; --sea-deep:#06203A; --sea-shallow:#1B5A78; --foam:#C3DAEA; --sand:#A8946A; --grass:#2F6340; --leaf:#24502F;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --panel:#12243C; --ink:#F1E4C6; --muted:#A9B4C2; --brass:#E3B04B; --seal:#E0654F; --teal:#5CC6CF; --ok:#7CC46A;
  --line:rgba(241,228,198,.2); --hudbg:rgba(18,36,60,.9); --on-brass:#12243C;
  --sky:#050B1F; --horizon:#1C3058; --sea-deep:#06203A; --sea-shallow:#1B5A78; --foam:#C3DAEA; --sand:#A8946A; --grass:#2F6340; --leaf:#24502F;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--sky);color:var(--ink);font-family:"Alegreya Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;display:block;width:100%;height:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
.fell{font-family:"IM Fell English SC",Georgia,"Times New Roman",serif;font-weight:400}

/* HUD */
.hud{position:fixed;top:0;left:0;right:0;z-index:10;pointer-events:none;display:flex;justify-content:space-between;align-items:flex-start;
  padding:calc(10px + env(safe-area-inset-top,0px)) 10px 0}
.hud button{pointer-events:auto}
.panel{background:var(--hudbg);border:1px solid var(--line);border-radius:14px;padding:8px 11px 9px;width:min(196px,52vw)}
.who{display:flex;align-items:baseline;gap:6px;white-space:nowrap;overflow:hidden}
.who b{font-size:.98rem}
.who span{font-size:.78rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.lv{display:flex;align-items:center;gap:7px;margin:3px 0 5px;font-size:.78rem;font-weight:700}
.xp{flex:1;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.xp i{display:block;height:100%;background:var(--brass);width:0}
.brow{display:grid;grid-template-columns:42px 1fr;align-items:center;gap:6px;font-size:.72rem;color:var(--muted);font-weight:500;margin-bottom:3px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--seal);transition:width .15s}
.bar.ship i{background:#8A5A2B}
.nums{display:flex;gap:12px;font-size:.84rem;white-space:nowrap;margin-top:5px}
.nums b{font-weight:700}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.btns{display:flex;gap:6px}
.icon{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--hudbg);display:grid;place-items:center;padding:0}
.icon svg{width:18px;height:18px;fill:currentColor}
#mini{width:108px;height:108px;border-radius:14px;border:1px solid var(--line);background:var(--hudbg)}
.goal{position:fixed;left:10px;top:calc(170px + env(safe-area-inset-top,0px));z-index:10;pointer-events:none;display:flex;align-items:center;gap:8px;max-width:min(340px,64vw);
  background:var(--hudbg);border:1px solid var(--line);border-left:4px solid var(--brass);border-radius:12px;padding:7px 11px 7px 8px;font-weight:700;font-size:.84rem;line-height:1.25}
.goal svg{flex:none;width:22px;height:22px;fill:var(--seal);transition:transform .15s linear}
.goal b{flex:none;color:var(--muted);font-size:.78rem}

/* Steuerung */
.ctrl{position:fixed;z-index:10;border-radius:50%;display:grid;place-items:center;text-align:center;line-height:1.05;border:0;padding:5px;font-weight:700}
.ctrl span{width:100%;height:100%;border-radius:50%;background:var(--hudbg);display:grid;place-items:center;font-size:.84rem}
.ctrl:active{transform:scale(.94)}
.fire{width:76px;height:76px;bottom:calc(20px + env(safe-area-inset-bottom,0px));background:conic-gradient(var(--seal) calc(var(--p,1) * 360deg),color-mix(in srgb,var(--seal) 25%,transparent) 0)}
#fireL{right:100px}#fireR{right:14px}
.fire.aim span{background:var(--seal);color:#fff}
.atk{right:16px;bottom:calc(22px + env(safe-area-inset-bottom,0px));width:94px;height:94px;background:var(--seal)}
.atk span{font-size:1rem}
.dodge{right:122px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:62px;height:62px;background:conic-gradient(var(--teal) calc(var(--p,1) * 360deg),color-mix(in srgb,var(--teal) 25%,transparent) 0)}
.potion{right:194px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:56px;height:56px;background:var(--ok)}
.potion span{font-size:.62rem}
.slot{width:60px;height:60px;bottom:calc(var(--sb,100px) + env(safe-area-inset-bottom,0px));background:conic-gradient(var(--pc,#B98CFF) calc(var(--p,1) * 360deg),color-mix(in srgb,var(--pc,#B98CFF) 20%,transparent) 0)}
.slot span{font-size:.6rem;padding:3px;line-height:1.05;overflow:hidden}
.slot.ready span{background:var(--pc,#B98CFF);color:#1B1410}
.slot.dim,.slot.empty{opacity:.45}
#s0{right:18px;--sb:130px}#s1{right:84px;--sb:120px}#s2{right:148px;--sb:92px}
body[data-mode="sail"] #s0{right:16px;--sb:106px}body[data-mode="sail"] #s1{right:82px;--sb:106px}body[data-mode="sail"] #s2{right:148px;--sb:106px}
.bar.faji i{background:linear-gradient(90deg,#7A5ACF,#C77DFF)}
.icon{position:relative}
.badge{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;border-radius:10px;background:var(--seal);color:#fff;font-size:.7rem;font-weight:800;display:grid;place-items:center;padding:0 4px}
.list strong em{font-style:normal;font-weight:500;color:var(--muted);font-size:.85rem;margin-left:6px}
.list.sk li.have .dot{box-shadow:0 0 0 3px var(--ink)}
.list.sk li{flex-wrap:wrap}
.buy.alt{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.picker{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.tabs button small{font-weight:500;opacity:.7;margin-left:5px}
.rank{list-style:none;padding:0;margin:0 0 10px}
.rank li{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;padding:8px 4px;border-top:1px solid var(--line)}
.rank li.me{background:color-mix(in srgb,var(--brass) 20%,transparent);border-radius:10px}
.rank b{font-family:"IM Fell English SC",Georgia,serif;font-size:1.15rem}
.rank small{display:block;color:var(--muted);font-size:.8rem}
.rank span{font-weight:700;font-size:.9rem}
.rank li.down{opacity:.5}
.rank li.down div{text-decoration:line-through}
.pow{right:30px;bottom:calc(126px + env(safe-area-inset-bottom,0px));width:66px;height:66px;
  background:conic-gradient(var(--pc,var(--brass)) calc(var(--p,0) * 360deg),color-mix(in srgb,var(--brass) 22%,transparent) 0)}
body[data-mode="sail"] .pow{right:58px;bottom:calc(104px + env(safe-area-inset-bottom,0px))}
.pow span{font-size:.68rem}
.pow.ready span{background:var(--pc,var(--brass));color:#1B1410}
.ctx{position:fixed;z-index:10;right:14px;bottom:calc(214px + env(safe-area-inset-bottom,0px));border:0;border-radius:999px;background:var(--brass);color:var(--on-brass);
  font-weight:800;padding:12px 18px;font-size:1rem;box-shadow:0 4px 0 rgba(0,0,0,.25)}
body[data-mode="sail"] .ctx{bottom:calc(186px + env(safe-area-inset-bottom,0px))}
.ctx.hot{background:var(--seal);color:#fff;animation:pulse .9s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
body[data-mode="sail"] .m-foot,body[data-mode="foot"] .m-sail{display:none!important}
.joy{position:fixed;z-index:9;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:2px solid rgba(255,255,255,.55);pointer-events:none}
.joy i{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:rgba(255,255,255,.45)}
.hint{position:fixed;left:16px;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:9;pointer-events:none;color:#fff;font-weight:700;
  text-shadow:0 1px 3px rgba(0,0,0,.6);font-size:.88rem;max-width:42vw;line-height:1.3}

.toast{position:fixed;left:50%;top:calc(33% + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:11;pointer-events:none;
  background:var(--hudbg);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-weight:500;white-space:nowrap;opacity:0;transition:opacity .3s;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1}
.prog{position:fixed;left:50%;bottom:calc(270px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:11;pointer-events:none;
  background:var(--hudbg);border:1px solid var(--line);border-radius:12px;padding:7px 14px 9px;font-weight:700;font-size:.9rem;text-align:center;min-width:150px}
.prog .bar i{background:var(--brass)}
.prog .bar{margin-top:5px}
.banner{position:fixed;left:0;right:0;top:16%;z-index:11;text-align:center;pointer-events:none;opacity:0;padding:0 16px}
.banner h2{font-size:clamp(2rem,9vw,3.2rem);margin:0;line-height:1;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.5)}
.banner p{margin:.45em 0 0;color:#fff;font-weight:500;text-shadow:0 1px 4px rgba(0,0,0,.55)}
.banner.show{animation:bn 3s ease-out forwards}
@keyframes bn{0%{opacity:0;transform:translateY(8px)}12%{opacity:1;transform:none}78%{opacity:1}100%{opacity:0}}
.cutin{position:fixed;left:-10%;right:-10%;top:40%;z-index:12;pointer-events:none;height:92px;transform:skewY(-6deg) scaleX(0);
  background:repeating-linear-gradient(90deg,var(--cc,#E3B04B) 0 26px,color-mix(in srgb,var(--cc,#E3B04B) 75%,#fff) 26px 30px);display:grid;place-items:center;box-shadow:0 0 0 6px #1B1410}
.cutin b{font-style:italic;font-weight:800;font-size:clamp(1.8rem,9vw,3.4rem);color:#fff;text-shadow:3px 3px 0 #1B1410}
.cutin.show{animation:cut 1.1s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes cut{0%{transform:skewY(-6deg) scaleX(0)}18%{transform:skewY(-6deg) scaleX(1)}80%{transform:skewY(-6deg) scaleX(1);opacity:1}100%{transform:skewY(-6deg) scaleX(1.1);opacity:0}}
.num{position:fixed;z-index:9;pointer-events:none;font-weight:800;font-style:italic;color:#fff;text-shadow:2px 2px 0 rgba(0,0,0,.6);transform:translate(-50%,-50%);white-space:nowrap}
.vign{position:fixed;inset:0;z-index:8;pointer-events:none;box-shadow:inset 0 0 120px 30px rgba(200,20,20,.55);opacity:0;transition:opacity .25s}
.vign.on{opacity:1}

/* Karten / Menüs */
.screen{position:fixed;inset:0;z-index:20;display:flex;overflow-y:auto;touch-action:pan-y;background:rgba(5,15,25,.3);
  padding:calc(18px + env(safe-area-inset-top,0px)) 14px calc(18px + env(safe-area-inset-bottom,0px))}
.screen.bottom{display:block;padding-top:calc(46vh + env(safe-area-inset-top,0px));background:linear-gradient(transparent 40%,rgba(5,15,25,.35))}
.card{width:100%;max-width:28rem;margin:auto;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:24px 20px 20px;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.screen.bottom .card{margin:0 auto}
.card h1{font-size:clamp(2.5rem,12vw,3.5rem);line-height:.95;margin:0 0 .3em}
.card h2{font-size:1.9rem;line-height:1;margin:0 0 .4em}
.card h3{font-size:1.02rem;margin:1em 0 .45em}
.card p{line-height:1.5;margin:0 0 .85em;font-size:1.03rem}
.soft{color:var(--muted);font-size:.95rem}
.primary{width:100%;border:0;border-radius:14px;background:var(--brass);color:var(--on-brass);font-weight:700;font-size:1.06rem;padding:14px 18px;margin-top:6px}
.secondary{width:100%;border:1.5px solid var(--line);border-radius:14px;background:transparent;font-weight:700;font-size:1rem;padding:12px 18px;margin-top:10px}
.tabs{display:flex;gap:6px;margin:0 0 12px;overflow-x:auto;padding-bottom:2px}
.tabs button{flex:none;border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:7px 13px;font-weight:700;font-size:.9rem}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.list{list-style:none;margin:0 0 6px;padding:0}
.list li{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.list li>div{flex:1;min-width:0}
.list strong{display:block;font-size:1rem}
.list span{font-size:.86rem;color:var(--muted);display:block}
.buy{flex:none;border:0;border-radius:10px;background:var(--brass);color:var(--on-brass);font-weight:700;padding:9px 11px;min-width:88px;font-size:.88rem}
.buy:disabled{opacity:.38;cursor:default}
.list .dot{display:grid;color:#fff;font-size:.9rem;font-weight:800}
.tag{flex:none;font-size:.8rem;font-weight:700;color:var(--ok)}
.dot{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:.9rem}
.purse{display:flex;gap:16px;margin:0 0 10px;font-size:.98rem}
.opt{margin:0 0 12px}
.opt label{display:block;font-size:.84rem;font-weight:700;color:var(--muted);margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:7px 12px;font-weight:700;font-size:.88rem}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid transparent;padding:0;box-shadow:0 0 0 1px var(--line)}
.sw[aria-pressed="true"]{border-color:var(--ink)}
.txt{-webkit-user-select:text;user-select:text;width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;font:inherit;font-size:1.05rem;background:transparent;color:var(--ink)}
.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 14px;margin:0 0 10px}
.facts div{font-size:.84rem;color:var(--muted)}
.facts b{display:block;font-size:1.08rem;color:var(--ink)}
.how{margin:0 0 1em;padding:0;list-style:none;font-size:.95rem}
.how li{padding:5px 0 5px 18px;position:relative;line-height:1.4}
.how li::before{content:"";position:absolute;left:2px;top:12px;width:7px;height:7px;border-radius:50%;background:var(--brass)}
.err{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;z-index:30;background:var(--panel)}
@media (prefers-reduced-motion:reduce){.ctx.hot{animation:none}.cutin.show{animation-duration:1.6s}}
</style>
</head>
<body data-mode="sail">
<canvas id="c" aria-label="3D-Spielwelt"></canvas>

<header class="hud" id="hud" hidden>
  <div class="panel">
    <div class="who"><b id="hName">Fynn</b><span id="hRank"></span></div>
    <div class="lv"><span id="hLvl">Stufe 1</span><div class="xp"><i id="xpBar"></i></div></div>
    <div class="brow">Leben<div class="bar"><i id="hpBar"></i></div></div>
    <div class="brow">Faji<div class="bar faji"><i id="fjBar"></i></div></div>
    <div class="brow">Schiff<div class="bar ship"><i id="shBar"></i></div></div>
    <div class="nums"><span>Gold <b id="gold">0</b></span><span>Ruhm <b id="ruhm">0</b></span></div>
  </div>
  <div class="right">
    <div class="btns">
      <button class="icon" id="skBtn" aria-label="Faji-Baum"><svg viewBox="0 0 24 24"><path d="M12 2l2.2 6.4L21 9l-5.2 4.3L17.6 20 12 16.3 6.4 20l1.8-6.7L3 9l6.8-.6z"/></svg><b class="badge" id="spBadge" hidden>0</b></button>
      <button class="icon" id="logBtn" aria-label="Logbuch"><svg viewBox="0 0 24 24"><path d="M5 3h11a3 3 0 0 1 3 3v15H8a3 3 0 0 1-3-3zm3 14a1 1 0 0 0 0 2h9v-2zM8 7v2h7V7zm0 4v2h5v-2z"/></svg></button>
      <button class="icon" id="muteBtn" aria-label="Ton ausschalten"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8.5a5 5 0 0 1 0 7l-1.3-1.3a3.2 3.2 0 0 0 0-4.4zM18.6 6a8.6 8.6 0 0 1 0 12l-1.3-1.3a6.8 6.8 0 0 0 0-9.4z"/></svg></button>
      <button class="icon" id="pauseBtn" aria-label="Pause"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
    </div>
    <canvas id="mini" width="216" height="216" aria-label="Seekarte"></canvas>
  </div>
</header>
<div class="goal" id="goal" hidden><svg viewBox="0 0 24 24" id="qArrow" aria-hidden="true"><path d="M12 2l7 18-7-4-7 4z"/></svg><span id="qTxt"></span><b id="qDist"></b></div>

<div id="ctl" hidden>
  <button class="ctrl fire m-sail" id="fireL" aria-label="Nach links feuern"><span>Links</span></button>
  <button class="ctrl fire m-sail" id="fireR" aria-label="Nach rechts feuern"><span>Rechts</span></button>
  <button class="ctrl atk m-foot" id="atkBtn" aria-label="Angriff"><span>Angriff</span></button>
  <button class="ctrl dodge m-foot" id="dodgeBtn" aria-label="Ausweichrolle"><span>Rolle</span></button>
  <button class="ctrl potion m-foot" id="potBtn" aria-label="Proviant essen"><span>Proviant<br><b id="potN">2</b></span></button>
  <button class="ctrl slot" id="s0" aria-label="Fähigkeit 1"><span>Leer</span></button>
  <button class="ctrl slot" id="s1" aria-label="Fähigkeit 2"><span>Leer</span></button>
  <button class="ctrl slot" id="s2" aria-label="Fähigkeit 3"><span>Leer</span></button>
  <button class="ctx" id="ctxBtn" hidden></button>
</div>
<div class="joy" id="joy" hidden><i id="joyKnob"></i></div>
<div class="hint" id="hint" hidden></div>
<div class="prog" id="prog" hidden><span id="progTxt"></span><div class="bar"><i id="progBar"></i></div></div>
<div class="toast" id="toast" aria-live="polite"></div>
<div class="banner" id="banner"><h2 class="fell" id="bannerH"></h2><p id="bannerP"></p></div>
<div class="cutin" id="cutin"><b id="cutTxt"></b></div>
<div class="vign" id="vign"></div>
<div id="nums"></div>
<section class="screen" id="screen"><div class="card" id="card"></div></section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
(()=>{

function opponents(F){return F.team==='P'?fighters.filter(f=>f.team==='E'&&f.state!=='dead'):fighters.filter(f=>f.team==='P'&&f.state!=='dead'&&f.state!=='down').concat(PF.state!=='dead'&&G.mode==='foot'&&PF.arena===F.arena?[PF]:[]);}
function hitFighter(T,dmg,src,kb=6,opts={}){

  if(T.isPlayer){
    if(Math.random()<skl('vorahnung')*.12){addNum(worldOf(T,1.8),'Ausgewichen','#BFEAFF');return false;}
    if(S.style==='schwert'&&skl('riposte')&&src&&src.maxHp&&Math.random()<skl('riposte')*.18){addNum(worldOf(T,1.8),'Konter!','#9FD0F0');sfx.clang();hitFighter(src,MA()*.9,T,8,{col:'#9FD0F0'});return false;}
    dmg*=dmgTakenMult();if(src&&src.lvl&&src.lvl<S.lvl)dmg*=1-skl('furcht')*.12;if(G.titan>0)dmg*=.67;}
  T.hp-=dmg;const wp=worldOf(T,1.4);addNum(wp,Math.round(dmg),T.isPlayer?'#FF8A7A':opts.col||(opts.crit?'#FFD166':'#FFFFFF'),opts.crit);
  burst(PS.spark,wp,8,7,6,.35);sfx.clang();
  if(!(T.isPlayer&&G.steel>0)){const a=src?Math.atan2(T.z-src.z,T.x-src.x):T.ang+Math.PI;T.vx+=Math.cos(a)*kb;T.vz+=Math.sin(a)*kb;}
  T.squash=.15;if(T.state==='windup'&&T.kind!=='golem'&&T.kind!=='legend'&&!T.isPlayer){T.state='hurt';T.t=0;T.excl.visible=false;}
  if(T.isPlayer){G.shake=Math.max(G.shake,.45);vign();sfx.hurt();
    if(T.hp>0&&T.hp<maxHp()*.25&&skl('atem')&&!G.atemUsed){G.atemUsed=true;T.hp+=maxHp()*.35;addNum(worldOf(T,2.2),'Zweiter Atem!','#FFD166',true);}}
  if(T.hp<=0){T.hp=0;if(T.isPlayer)knockout('foot');else if(T.team==='P'){T.state='down';T.t=0;T.bar.visible=false;}else killFighter(T,src);}
  return true;
}
function killFighter(T){
  T.state='dead';T.t=0;T.bar.visible=false;T.excl.visible=false;T.ice.visible=false;G.hitstop=Math.max(G.hitstop,.06);
  const k=KIND[T.kind];const g=Math.round(R(k.gold[0],k.gold[1])*(1+.25*(T.lvl-1))*goldMult());S.gold+=g;sfx.coin();
  const wp=worldOf(T,1.5);burst(PS.gold,wp,10,4,8,1);addNum(wp.clone().add(V().set(0,.8,0)),'+'+g+' Gold','#FFD166');
  gainXP(k.xp*(1+.3*(T.lvl-1)));gainRuhm(T.kind==='golem'?40:T.kind==='legend'?80:T.kind==='captain'?12:2);S.stats.beaten++;
  if(skl('blutrausch'))G.rush=Math.min(.4,(G.rush||0)+.08);
}
function updFighter(F,dt){
  F.t+=dt;F.inv=Math.max(0,F.inv-dt);F.cd-=dt;if(F.squash>0)F.squash-=dt;
  F.fig.body.scale.setScalar((F.fig.big||1)*(F.squash>0?1+Math.sin(F.squash*40)*.06:1));
  if(F.state==='dead'||F.state==='down'){F.fig.body.rotation.z=Math.min(1.5,F.t*5)*(F.state==='down'?.9:1);F.fig.body.position.y=-Math.min(.3,F.t);
    if(F.state==='down'&&hasCrew('arzt')&&F.t>6){F.state='idle';F.hp=F.maxHp*.4;F.fig.body.rotation.z=0;F.fig.body.position.y=0;addNum(worldOf(F,2.2),'Wieder auf!','#7CE07A');}
    if(F.state==='dead'&&F.t>2.2){F.fig.g.scale.setScalar(Math.max(.01,1-(F.t-2.2)*2));if(F.t>2.7)F.gone=true;}return;}
  if(F.frozen>0){F.frozen-=dt;F.ice.visible=true;if(F.frozen<=0)F.ice.visible=false;F.vx*=.8;F.vz*=.8;return;}
  if(F.burn>0){F.burn-=dt;F.hp-=dt*F.burnDps;const p=worldOf(F,1.2);if(Math.random()<dt*25)PS.fire.emit(p.x+R(-.4,.4),p.y,p.z+R(-.4,.4),0,R(2,4),0,.5);
    if(F.hp<=0){F.hp=0;if(F.team==='E')killFighter(F);else F.state='down';return;}}
  if(F.poison>0){F.poison-=dt;F.hp-=dt*F.poisonDps;if(Math.random()<dt*14){const p=worldOf(F,1.4);PS.gift.emit(p.x,p.y,p.z,R(-.5,.5),R(.5,1.5),R(-.5,.5),.6);}
    if(F.hp<=0){F.hp=0;if(F.team==='E')killFighter(F);else F.state='down';return;}}
  F.x+=F.vx*dt;F.z+=F.vz*dt;F.vx*=Math.max(0,1-dt*7);F.vz*=Math.max(0,1-dt*7);
  if(F.stun>0){F.stun-=dt;F.excl.visible=false;if(F.state==='windup'||F.state==='strike')F.state='idle';
    if(Math.random()<dt*8){const w=worldOf(F,2.6);PS.spark.emit(w.x,w.y,w.z,R(-1,1),R(0,1),R(-1,1),.4);}
    F.fig.body.rotation.y=Math.sin(G.t*10)*.15;F.arena.clamp(F);syncFig(F);F.bar.visible=F.hp<F.maxHp;F.fg.scale.x=1.6*F.hp/F.maxHp;return;}
  F.fig.body.rotation.y=0;
  const opp=opponents(F);let tgt=null,td=1e9;for(const o of opp){if(o.arena!==F.arena)continue;const d=Math.hypot(o.x-F.x,o.z-F.z);if(d<td){td=d;tgt=o;}}
  let moving=false;const fig=F.fig;
  if(tgt){
    const ta=Math.atan2(tgt.z-F.z,tgt.x-F.x);
    if(F.special){F.spCd-=dt;if(F.spCd<=0&&td<8&&(F.state==='idle'||F.state==='move')){F.spCd=R(6,9);legendSpecial(F,opp);}}
    if(F.state==='idle'||F.state==='move'){
      F.ang+=angDiff(F.ang,ta)*Math.min(1,dt*8);
      if(td>F.reach*.9){F.x+=Math.cos(ta)*F.spd*dt;F.z+=Math.sin(ta)*F.spd*dt;moving=true;F.state='move';}
      else{F.state='idle';if(F.cd<=0){F.state='windup';F.t=0;if(F.team==='E')F.excl.visible=true;}}
    }else if(F.state==='windup'){
      F.ang+=angDiff(F.ang,ta)*Math.min(1,dt*3);const p=F.t/F.wind;fig.arms[0].rotation.z=lerpA(fig.arms[0].rotation.z,2.6,dt*10);
      if(F.kind==='golem')fig.arms[1].rotation.z=lerpA(fig.arms[1].rotation.z,2.6,dt*10);
      if(p>=1){F.state='strike';F.t=0;F.excl.visible=false;sfx.swing();const am=F.team==='P'?allyMult():1;
        if(F.kind==='golem'){const wp=worldOf(F,.2);ringFx(scene,wp.x,wp.y+.2,wp.z,0xd9c9a0,1,F.reach*1.6,.4);G.shake=Math.max(G.shake,.5);
          for(const o of opp){if(o.arena===F.arena&&Math.hypot(o.x-F.x,o.z-F.z)<F.reach*1.5)hitFighter(o,F.atk,F,10);}}
        else{slashFx(F.arena.group,F.x,F.arena.h(F.x,F.z)+1.1,F.z,F.ang,false,F.team==='E'?0xff9a8a:0xc8ffd0);
          if(td<F.reach*1.2&&Math.abs(angDiff(F.ang,ta))<1.2)hitFighter(tgt,F.atk*am*R(.9,1.1),F,6);}}
    }else if(F.state==='strike'){fig.arms[0].rotation.z=lerpA(fig.arms[0].rotation.z,.2,dt*18);if(F.kind==='golem')fig.arms[1].rotation.z=lerpA(fig.arms[1].rotation.z,.2,dt*18);
      if(F.t>.35){F.state='idle';F.cd=F.team==='P'?R(.6,1.1):R(.9,1.7)*(F.kind==='brute'?1.3:1);}}
    else if(F.state==='hurt'){if(F.t>.3){F.state='idle';F.cd=Math.max(F.cd,.4);}}
  }else F.state='idle';
  for(const o of fighters){if(o===F||o.arena!==F.arena||o.state==='dead')continue;const dx=F.x-o.x,dz=F.z-o.z,d=Math.hypot(dx,dz);if(d<1.1&&d>0){F.x+=dx/d*(1.1-d)*.5;F.z+=dz/d*(1.1-d)*.5;}}
  F.arena.clamp(F);
  F.walk+=dt*(moving?9:0);const sw=moving?Math.sin(F.walk)*.6:0;

const lerpA=(a,b,k)=>a+(b-a)*Math.min(1,k);

/* =============== Arenen =============== */

function arenaIsland(isl){return {type:'island',isl,group:isl.g,h:(x,z)=>islandH(isl,x,z),clamp:p=>{const d=Math.hypot(p.x,p.z),m=isl.r*.8;if(d>m){p.x*=m/d;p.z*=m/d;}}};}
function moveFigTo(F,arena,x,z,ang){if(F.fig.g.parent)F.fig.g.parent.remove(F.fig.g);arena.group.add(F.fig.g);F.arena=arena;F.x=x;F.z=z;F.ang=ang||0;F.vx=F.vz=0;syncFig(F);}
function spawnAllies(arena,x,z,ang){const n=S.tier>=4?4:3;
  S.crew.slice(0,n).forEach((id,i)=>{const c=CREW.find(q=>q.id===id);if(!c)return;
    makeFighter({team:'P',kind:'ally',lvl:S.lvl,arena,x:x-Math.cos(ang)*1.5+Math.cos(ang+Math.PI/2)*(i-1.5)*1.6,z:z-Math.sin(ang)*1.5+Math.sin(ang+Math.PI/2)*(i-1.5)*1.6,ang,look:c.look,name:c.name,crewId:id,
      atkMul:hasCrew('ram')?1.3:1,hpMul:id==='ram'?1.6:id==='tomo'?2.5:1});
    if(pship.crewFigs[id])pship.crewFigs[id].g.visible=false;});}
function clearFighters(keepArena){shots.forEach(s=>s.ar.group.remove(s.m));shots=[];G.zones=[];fighters.forEach(f=>{if(f.fig.g.parent)f.fig.g.parent.remove(f.fig.g);disposeObj(f.fig.g);});fighters=[];
  if(pship)Object.values(pship.crewFigs).forEach(f=>f.g.visible=true);}

/* =============== Modus-Wechsel =============== */
function setMode(m){G.mode=m;document.body.dataset.mode=m;}
function goDeck(){ // vom Steuer an Deck
  setMode('foot');P.throttle=0;const ar=arenaShip(pship);PF.arena=ar;PF.x=-pship.L*.22-1.2;PF.z=0;PF.ang=0;PF.state='idle';G.camYaw=P.ang;
  moveFigTo(PF,ar,PF.x,PF.z,0);resetPose(PF.fig);hint('Lauf über dein Deck. „Ans Steuer“ bringt dich zurück an die Segel.');}

function goLand(isl){
  const a=Math.atan2(P.z-isl.z,P.x-isl.x),lx=Math.cos(a)*isl.r*.76,lz=Math.sin(a)*isl.r*.76;

/* =============== Begegnungen =============== */
function startEncounter(type,arena,list,onWin,title){
  G.enc={type,arena,onWin};G.atemUsed=false;G.rush=0;spawnAllies(arena,PF.x,PF.z,PF.ang);
  list.forEach(o=>makeFighter(Object.assign({team:'E',arena},o)));

}
function startCamp(isl){
  const fac=foeFaction(),lv=Math.max(isl.lvl,Math.round(S.lvl*.7)),n=2+Math.min(4,Math.floor(isl.lvl/2));const list=[];
  for(let i=0;i<n;i++){const a=isl.ka+R(-.8,.8),d=isl.r*R(.45,.7);list.push({kind:'grunt',lvl:lv,x:Math.cos(a)*d,z:Math.sin(a)*d,ang:a+Math.PI,look:lookFor(fac,'grunt')});}

    const c=spawnChest(isl,isl.kx*.75+2,isl.kz*.75,Math.round((80+isl.lvl*40)*goldMult()));gainRuhm(30+isl.lvl*10);gainXP(40+isl.lvl*15);

function startRuin(isl){

function startBoarding(e){
  const side=Math.sign(Math.sin(angDiff(P.ang,Math.atan2(e.z-P.z,e.x-P.x))))||1;
  e.boarded=true;e.ang=P.ang;const off=pship.W/2+e.W/2+1.4;e.x=P.x+Math.cos(P.ang+side*Math.PI/2)*off;e.z=P.z+Math.sin(P.ang+side*Math.PI/2)*off;
  P.spd=0;P.throttle=0;setMode('foot');const ar=arenaShip(e.sh);G.camYaw=P.ang;
  e.sh.g.children.filter(c=>c.userData.fig).forEach(c=>e.sh.g.remove(c));
  moveFigTo(PF,ar,0,-side*e.W*.28,0);resetPose(PF.fig);PF.state='idle';PF.inv=1;
  const lv=e.lvl,fac=e.fac==='handel'?'pirat':e.fac,n=clamp(2+e.tier*2,2,10),list=[];
  for(let i=0;i<n;i++){const k=i<Math.floor(e.tier/2)?'brute':'grunt';list.push({kind:k,lvl:lv,x:R(-e.L*.15,e.L*.32),z:side*R(0,e.W*.3),look:lookFor(fac,k)});}

  sfx.clang();
  startEncounter('board',ar,list,()=>{const g=Math.round((70+e.tier*90)*Math.sqrt(e.lvl)*goldMult()*(e.trader?1.8:1));S.gold+=g;S.stats.boarded++;gainXP(50+e.tier*40+e.lvl*6);gainRuhm(35*(e.tier+1)+e.lvl*5);
    if(e.legend)defeatLegend(e.legend,true);else banner('Schiff erobert!','+'+fmt(g)+' Gold Beute');sfx.treasure();
    setTimeout(()=>{if(G.state!=='play')return;e.boarded=false;e.sink=.001;e.gone=false;clearFighters();goDeckAfterBoard();save();},1600);},e.legend?e.legend.n:'Entern!');
}
function goDeckAfterBoard(){setMode('foot');const ar=arenaShip(pship);moveFigTo(PF,ar,0,0,0);resetPose(PF.fig);G.camYaw=P.ang;hint('Zurück an Bord. „Ans Steuer“ bringt dich an die Segel.');}
function updEncounter(){

  if(!fighters.some(f=>f.team==='E'&&f.state!=='dead')){G.enc=null;fighters.filter(f=>f.team==='P').forEach(f=>{if(f.state==='down'){f.state='idle';f.hp=f.maxHp*.5;f.fig.body.rotation.z=0;f.fig.body.position.y=0;}});
    sfx.win();e.onWin();}

function spawnChest(isl,x,z,gold){const g=new THREE.Group();const b=mesh(G_BOX,'#7A4A26',1.06);b.scale.set(1.6,1,1.1);b.position.y=.5;g.add(b);
  const lid=new THREE.Group();lid.position.set(-.8,1,0);g.add(lid);const l=mesh(G_BOX,'#8E5A2E',1.06);l.scale.set(1.6,.35,1.1);l.position.set(.8,.17,0);lid.add(l);
  const bd=mesh(G_BOX,'#C9A13B');bd.scale.set(.2,1.05,1.15);bd.position.y=.5;g.add(bd);

/* =============== Spieler zu Fuß =============== */
function updPlayerFoot(dt){
  const F=PF,fig=F.fig;F.inv=Math.max(0,F.inv-dt);F.rollCd=Math.max(0,(F.rollCd||0)-dt);if(F.squash>0)F.squash-=dt;

  const wx=fx*(-mz)+rx*mx,wz=fz*(-mz)+rz*mx,wl=Math.hypot(wx,wz),ay=arenaYaw(F.arena);let la=0;if(wl>.05)la=Math.atan2(wz,wx)-ay;
  let moving=false;const spd=6*(1+skl('sprint')*.1)*(G.titan>0?1.15:1);
  if(F.state==='roll'){F.t+=dt;F.x+=Math.cos(F.rollA)*12*dt;F.z+=Math.sin(F.rollA)*12*dt;fig.body.rotation.z=-F.t/.38*TAU;if(F.t>.38){F.state='idle';fig.body.rotation.z=0;}}
  else if(F.state==='dash'){F.t+=dt;F.x+=Math.cos(F.ang)*F.dashSp*dt;F.z+=Math.sin(F.ang)*F.dashSp*dt;const wp=worldOf(F,1);for(let i=0;i<3;i++)PS.wind.emit(wp.x+R(-1,1),wp.y+R(-1,1),wp.z+R(-1,1),R(-2,2),R(0,3),R(-2,2),.5);
    for(const o of opponents(F)){if(o.arena===F.arena&&!o.dashed&&Math.hypot(o.x-F.x,o.z-F.z)<2.4){o.dashed=1;hitFighter(o,F.dashDmg,F,F.dashKb,{col:F.dashCol});}}
    if(F.t>F.dashT){F.state='idle';fighters.forEach(o=>o.dashed=0);}}
  else if(F.state==='chan'){F.t+=dt;const c=F.chan;c.next-=dt;if(c.next<=0){c.next=c.tick;c.fn();}
    if(c.anim==='spin'){fig.arms[0].rotation.z=1.5;fig.body.rotation.y-=dt*16;}else{const s=Math.sin(F.t*40);fig.arms[0].rotation.z=1.25+s*.45;fig.arms[1].rotation.z=1.25-s*.45;}
    if(F.t>=c.dur){F.state='idle';fig.body.rotation.y=0;}}
  else if(F.state==='attack'){

function useSlot(i){if(G.state!=='play'||!S.slots)return;const id=S.slots[i];if(!id){openSkills();return;}const sk=SK[id];if(!sk||!sk.act||!skl(id))return;if((G.cds[id]||0)>0)return;
  const sea=G.mode==='sail',fn=sea?sk.act.sea:sk.act.foot;if(!fn){toast(sk.n+' wirkt nur an Land.');return;}
  if(!sea&&(G.act||['roll','dash','chan'].includes(PF.state)))return;if(PF.faji<sk.act.cost){toast('Zu wenig Faji.');return;}
  if(fn(skl(id))===false)return;PF.faji-=sk.act.cost;G.cds[id]=sk.act.cd*cdMult();sfxB(sk.b);
  if(sk.act.cost>=40)cutin(sk.n+'!',BRANCH[sk.b].col);else addNum(sea?V().set(P.x,9,P.z):fw(2.8),sk.n,BRANCH[sk.b].col);}
function branchPts(b){return SKILLS.filter(s=>s.b===b).reduce((a,s)=>a+skl(s.id),0);}
function canLearn(s){return S.sp>0&&skl(s.id)<s.max&&branchPts(s.b)>=s.req&&S.lvl>=(s.lv||1);}
function learn(id){const s=SK[id];if(!s||!canLearn(s))return;S.sp--;S.sk[id]=skl(id)+1;sfx.level();if(s.act&&!S.slots.includes(id)){const i=S.slots.indexOf(null);if(i>=0)S.slots[i]=id;}
  if(id==='quelle')PF.faji=maxFaji();save();updHud();renderSkills();}
let skTab=null;
function openSkills(){if(G.state!=='play')return;if(A.ctx)A.ctx.resume();G.state='modal';skTab=skTab||({faust:'koerper',schwert:'klinge',effekt:'effekt'}[S.style]||'klinge');G.pick=null;renderSkills();}
function renderSkills(){const b=skTab;
  let body=`<div class="tabs">${Object.keys(BRANCH).map(k=>`<button data-a="sktab" data-id="${k}" aria-pressed="${k===b}">${BRANCH[k].n}<small>${branchPts(k)}</small></button>`).join('')}</div><p class="soft">${BRANCH[b].d}</p>`;
  [1,2,3].forEach(t=>{const list=SKILLS.filter(s=>s.b===b&&s.t===t);if(!list.length)return;
    body+=`<h3>${['','Grundlagen','Fortgeschritten','Meisterschaft'][t]}${t>1?' <small class="soft">ab '+list[0].req+' Punkten in diesem Zweig</small>':''}</h3><ul class="list sk">`;
    list.forEach(s=>{const lv=skl(s.id),act=!!s.act,inSlot=S.slots.indexOf(s.id);
      body+=`<li class="${lv?'have':''}"><span class="dot" style="background:${BRANCH[b].col};color:#1B1410">${act?'A':'P'}</span><div><strong>${s.n}<em>${s.max>1?lv+'/'+s.max:lv?'gelernt':''}</em></strong>
      <span>${s.d(Math.max(1,lv))}${act?`. Kostet ${s.act.cost} Faji, ${s.act.cd} s Abklingzeit${s.act.sea?', wirkt auch auf See':''}`:''}${s.lv&&S.lvl<s.lv?'. Ab Stufe '+s.lv:''}</span>`
      +(G.pick===s.id?`<div class="picker">${[0,1,2].map(i=>`<button class="buy alt" data-a="slotset" data-id="${s.id}|${i}">Platz ${i+1}${S.slots[i]&&S.slots[i]!==s.id?': '+SK[S.slots[i]].n:''}</button>`).join('')}</div>`:'')+`</div>`

  else if(b.state==='burst'){b.sub=Math.max(0,b.sub-dt*2);swim(toP,6);if(b.t>.8){b.state='swim';b.t=0;b.diveT=R(7,10)-rage*3;}}
  const base=-b.sub*11*BS;let px=b.x,pz=b.z;
  b.v.segs.forEach((s,i)=>{const sx=s.x-px,sz=s.z-pz,sd=Math.hypot(sx,sz)||1;if(sd>2.6*BS){s.x=px+sx/sd*2.6*BS;s.z=pz+sz/sd*2.6*BS;}px=s.x;pz=s.z;s.y=base+Math.sin(G.t*2.2-i*.55)*2.6*BS-.3;s.g.position.set(s.x,s.y,s.z);});
  b.v.head.position.set(b.x,base+3*BS+Math.sin(G.t*2.2+.5)*.6,b.z);b.v.head.rotation.order='YXZ';b.v.head.rotation.y=-b.ang;b.v.jaw.rotation.z=-(.15+Math.abs(Math.sin(G.t*3))*.25);

  if(b.sub<.4&&d<7*BS&&act)damagePlayerShip(10);

function buy(id){
  const pay=c=>{if(S.gold<c)return false;S.gold-=c;sfx.coin();return true;};
  if(id==='repair'){if(pay(Math.ceil((shipMax()-P.hp)*.6)))P.hp=shipMax();}
  else if(id==='can'){if(pay(200+S.up.can*260)){S.up.can++;setCannons(pship,cannons());}}
  else if(id==='hull'){if(pay(150+S.up.hull*140)){S.up.hull++;P.hp+=35;}}
  else if(id==='sail'){if(pay(140+S.up.sail*150))S.up.sail++;}
  else if(id==='ship'){const s=SHIPS[S.tier+1];if(s&&pay(s.price)){S.tier++;buildPlayerShip();P.hp=shipMax();banner('Neues Schiff: '+s.n,s.L+' Meter, '+s.can+' Kanonen pro Seite');}}
  else if(id==='pot'){if(pay(40))S.potions++;}
  else if(id==='spbuy'){const n=S.flags.spBought||0;if(pay(Math.round(400*Math.pow(1.45,n)))){S.flags.spBought=n+1;S.sp++;toast('+1 Fähigkeitspunkt');}}
  else if(id==='respec'){if(pay(300)){S.sp+=Object.values(S.sk).reduce((a,b)=>a+b,0);S.sk={};S.slots=[null,null,null];toast('Dein Faji ist neu geordnet.');}}
  else if(id[0]==='b'&&BLADES[id.slice(1)]){if(pay(150)){S.blade=id.slice(1);equipPlayer();}}
  else if(id[0]==='w'){const i=+id.slice(1);if(pay(WEAPONS[i].price)){S.weapon=i;equipPlayer();}}
  else if(id[0]==='a'){const i=+id.slice(1);if(pay(ARMOR[i].price)){S.armor=i;PF.hp=maxHp();}}
  else if(id[0]==='c'){const c=CREW.find(x=>x.id===id.slice(1));if(c&&S.crew.length<SHIPS[S.tier].crew&&pay(c.price)){S.crew.push(c.id);addDeckCrew(c.id,S.crew.length-1);if(c.id==='carp')P.hp+=40;if(c.id==='lehrer')S.sp++;toast(c.name+' ist an Bord!');}}
  save();updHud();renderHarbor();
}

function update(dt){
  G.t+=dt;updFaji(dt);
  if(G.mode==='sail'){
    let turn=0;
    if(joy.active){turn=Math.abs(joy.x)>.12?joy.x:0;P.throttle=clamp(.5-joy.y*.6,0,1);}
    else{turn=(keys.right?1:0)-(keys.left?1:0);if(keys.up)P.throttle=Math.min(1,P.throttle+dt*.8);if(keys.down)P.throttle=Math.max(0,P.throttle-dt*.8);}
    P.turnIn=turn;P.ang+=turn*1.3*(hasCrew('helm')?1.6:1)*dt*(.35+.65*Math.min(1,P.spd/8))*(1.1-S.tier*.07);
    if(keys.fl||keys.hl)playerFire(-1);if(keys.fr||keys.hr)playerFire(1);
    PF.fig.arms[0].rotation.z=1.1+turn*.4;PF.fig.arms[1].rotation.z=1.1-turn*.4;
  }else{P.throttle=0;P.turnIn=0;}
  P.boost=Math.max(0,P.boost-dt);

  P.x+=Math.cos(P.ang)*P.spd*dt;P.z+=Math.sin(P.ang)*P.spd*dt;shipPush(P,true);
  P.relL-=dt;P.relR-=dt;P.powCd=Math.max(0,P.powCd-dt);
  if(hasCrew('cook')&&P.hp<shipMax())P.hp=Math.min(shipMax(),P.hp+dt*1.2);
  if(Math.random()<dt*(4+P.spd*1.2)){const bx=P.x-Math.cos(P.ang)*pship.L*.55,bz=P.z-Math.sin(P.ang)*pship.L*.55;PS.foam.emit(bx+R(-1,1),.6,bz+R(-1,1),-Math.sin(P.ang)*R(-1.5,1.5),0,Math.cos(P.ang)*R(-1.5,1.5),R(1.2,2.2));}
  if(P.boost>0&&Math.random()<dt*30)PS.wind.emit(P.x+R(-4,4),R(2,6),P.z+R(-4,4),-Math.cos(P.ang)*10,0,-Math.sin(P.ang)*10,.6);
  if(P.hp<shipMax()*.3&&Math.random()<dt*6)smoke(P.x,3,P.z,1);
  poseShip(pship,P.x,P.z,P.ang,G.t,-(P.turnIn||0)*.07*Math.min(1,P.spd/10),0);
  // Deck-Crew Leerlauf
  Object.values(pship.crewFigs).forEach((f,i)=>{f.body.position.y=Math.abs(Math.sin(G.t*3+i))*.05;if(f.tail)f.tail.rotation.x=Math.sin(G.t*3)*.4;if(f.arms[0])f.arms[0].rotation.z=.3+Math.sin(G.t*2+i)*.2;});

    if(isl.disc&&!isl.label){const kn={village:'Dorf',harbor:'Hafen',camp:S.faction==='pirat'?'Marine-Außenposten':'Piratenversteck',ruin:'Ruine',treasure:'Schatzinsel',empty:''}[isl.kind];
      isl.label=nameSprite(isl.name,(kn?kn+', ':'')+'Stufe '+isl.lvl);isl.label.position.set(isl.x,isl.hillH+26,isl.z);scene.add(isl.label);}

  if(G.state==='create'||(G.state==='menu'&&pship)){
    if(G.state==='menu'){const a=G.t*.12;tmp.set(P.x+Math.cos(a)*48,16,P.z+Math.sin(a)*48);look.set(P.x,5,P.z);}
    else{PF.fig.g.rotation.y=-Math.PI/2+(G.prevRot||0)+Math.sin(G.t*.5)*.15;const w=PF.fig.g.getWorldPosition(wtmp);const rx=-Math.sin(P.ang),rz=Math.cos(P.ang);
      const dist=portrait?7.2:5.2;tmp.set(w.x+rx*dist,w.y+(portrait?2.6:2),w.z+rz*dist);look.set(w.x,w.y+(portrait?-1.5:-.3),w.z);}
    if(G.snapCam){camPos.copy(tmp);G.snapCam=false;}camPos.lerp(tmp,Math.min(1,dt*5));
  }else if(G.mode==='sail'){
    let foe=null,fd=seaRange()*1.7;enemies.forEach(e=>{if(e.sink||e.boarded||(e.trader&&!e.hostile))return;const d=Math.hypot(e.x-P.x,e.z-P.z);if(d<fd){fd=d;foe=e;}});
    if(G.boss&&G.boss.sub<.8&&Math.hypot(G.boss.x-P.x,G.boss.z-P.z)<160){foe=G.boss;fd=Math.hypot(foe.x-P.x,foe.z-P.z);}
    const ty=foe?Math.atan2(foe.z-P.z,foe.x-P.x):P.ang;if(G.seaYaw===undefined)G.seaYaw=P.ang;G.seaYaw+=angDiff(G.seaYaw,ty)*Math.min(1,dt*(foe?1.4:1.8));
    const sep=foe?fd:0,L=pship.L,back=(portrait?22:16)+L*1.45+sep*.3,up=(portrait?12:8)+L*.6+sep*(portrait?.5:.32),fx=Math.cos(G.seaYaw),fz=Math.sin(G.seaYaw);
    tmp.set(P.x-fx*back,up,P.z-fz*back);camPos.lerp(tmp,Math.min(1,dt*2.5));
    if(foe)look.set(P.x+(foe.x-P.x)*.45,2,P.z+(foe.z-P.z)*.45);else look.set(P.x+fx*(12+L),2,P.z+fz*(12+L));
  }else{
    if(PF.arena&&PF.arena.type==='ship'){const ay=PF.arena.sh===pship?P.ang:(enemies.find(e=>e.sh===PF.arena.sh)||{ang:G.camYaw}).ang;G.camYaw+=angDiff(G.camYaw,ay)*Math.min(1,dt*2);}
    const w=PF.fig.g.getWorldPosition(wtmp),d=portrait?11.5:10,h=portrait?10:7.5;
    tmp.set(w.x-Math.cos(G.camYaw)*d,w.y+h,w.z-Math.sin(G.camYaw)*d);camPos.lerp(tmp,Math.min(1,dt*6));look.set(w.x+Math.cos(G.camYaw)*2,w.y+1,w.z+Math.sin(G.camYaw)*2);
  }
  camera.position.copy(camPos);
  if(G.shake>0&&!RM){camera.position.x+=R(-1,1)*G.shake;camera.position.y+=R(-1,1)*G.shake*.6;}
  G.shake=Math.max(0,G.shake-dt*2.2);camera.lookAt(look);
  sky.position.copy(camera.position);stars.position.copy(camera.position);
  const fpt=G.mode==='foot'&&PF.fig?PF.fig.g.getWorldPosition(wtmp):tmp.set(P.x,0,P.z);
  sun.position.set(fpt.x+SUNDIR.x*150,fpt.y+SUNDIR.y*150,fpt.z+SUNDIR.z*150);sun.target.position.copy(fpt);sun.target.updateMatrixWorld();
  lantern.position.set(P.x-Math.cos(P.ang)*5,5,P.z-Math.sin(P.ang)*5);
}
const mini=$('mini').getContext('2d');
function drawMini(){const Sz=216,k=Sz/WORLD,cols={treasure:'#C0271E',harbor:C.teal,camp:'#7A2A22',ruin:'#7A4FB0',village:'#D9B25A',empty:'#9A9A9A'};mini.clearRect(0,0,Sz,Sz);
  mini.strokeStyle='rgba(60,140,200,.6)';mini.lineWidth=3;mini.strokeRect(1.5,1.5,Sz-3,Sz-3);
  for(const i of islands){if(!i.disc)continue;const done=(i.kind==='treasure'&&i.st.done)||(i.kind==='ruin'&&i.st.done);mini.fillStyle=done?'rgba(150,150,150,.7)':cols[i.kind];
    mini.beginPath();mini.arc(i.x*k,i.z*k,Math.max(2.5,i.r*k*1.4),0,TAU);mini.fill();}
  for(const e of enemies){if(e.sink)continue;const d=Math.hypot(e.x-P.x,e.z-P.z);if(d>discR()*(e.legend?2.2:1))continue;
    if(e.legend){mini.fillStyle='#FFD166';mini.strokeStyle='#1B1410';mini.lineWidth=1.5;const x=e.x*k,y=e.z*k;mini.beginPath();mini.moveTo(x-7,y+4);mini.lineTo(x-7,y-4);mini.lineTo(x-3.5,y);mini.lineTo(x,y-6);mini.lineTo(x+3.5,y);mini.lineTo(x+7,y-4);mini.lineTo(x+7,y+4);mini.closePath();mini.fill();mini.stroke();continue;}
    mini.fillStyle=e.trader&&!e.hostile?'#2F9A5A':e.fac==='marine'?'#2B4A8C':'#151515';mini.fillRect(e.x*k-3,e.z*k-3,6,6);}
  if(!S.bossDown){mini.strokeStyle=C.seal;mini.lineWidth=3;const lx=lair.x*k,lz=lair.z*k;mini.beginPath();mini.moveTo(lx-6,lz-6);mini.lineTo(lx+6,lz+6);mini.moveTo(lx+6,lz-6);mini.lineTo(lx-6,lz+6);mini.stroke();}
  const q=questInfo();if(q.tgt){mini.fillStyle='#FFD166';mini.strokeStyle='#1B1410';mini.lineWidth=2;const qx=q.tgt.x*k,qz=q.tgt.z*k;mini.beginPath();
    for(let a=0;a<10;a++){const rr=a%2?4:9,an=a/10*TAU-Math.PI/2;mini.lineTo(qx+Math.cos(an)*rr,qz+Math.sin(an)*rr);}mini.closePath();mini.fill();mini.stroke();}
  mini.save();mini.translate(P.x*k,P.z*k);mini.rotate(P.ang);mini.fillStyle=C.ink;mini.beginPath();mini.moveTo(10,0);mini.lineTo(-6,-6);mini.lineTo(-6,6);mini.fill();mini.restore();}
let lastCtx='';
function hudFrame(dt){
  if($('hud').hidden||!S)return;
  $('hpBar').style.width=(PF.hp/maxHp()*100)+'%';$('shBar').style.width=(P.hp/shipMax()*100)+'%';$('gold').textContent=fmt(S.gold);$('ruhm').textContent=fmt(S.ruhm);
  $('xpBar').style.width=(S.xp/xpNeed(S.lvl)*100)+'%';$('hLvl').textContent='Stufe '+S.lvl;$('hRank').textContent=rankName();$('potN').textContent=S.potions;
  const rt=reloadT();$('fireL').style.setProperty('--p',clamp(1-P.relL/rt,0,1).toFixed(3));$('fireR').style.setProperty('--p',clamp(1-P.relR/rt,0,1).toFixed(3));
  updSlotsUI();$('spBadge').hidden=!S.sp;$('spBadge').textContent=S.sp;$('fjBar').style.width=(PF.faji/maxFaji()*100)+'%';
  $('dodgeBtn').style.setProperty('--p',(1-(PF.rollCd||0)/.85).toFixed(3));
  if(G.mode==='sail'){let aL=false,aR=false;const rg=seaRange();const chk=(x,z)=>{const d=Math.hypot(x-P.x,z-P.z);if(d>rg*1.02||d<4)return;const a=Math.atan2(z-P.z,x-P.x);
      if(Math.abs(angDiff(P.ang-Math.PI/2,a))<.5)aL=true;if(Math.abs(angDiff(P.ang+Math.PI/2,a))<.5)aR=true;};
    enemies.forEach(e=>{if(!e.sink&&!e.boarded)chk(e.x,e.z);});if(G.boss&&G.boss.sub<.5)chk(G.boss.x,G.boss.z);$('fireL').classList.toggle('aim',aL);$('fireR').classList.toggle('aim',aR);}
  G.ctx=computeCtx();const cb=$('ctxBtn');const key=G.ctx?G.ctx.label:'';
  if(key!==lastCtx){lastCtx=key;cb.hidden=!G.ctx;if(G.ctx){cb.textContent=G.ctx.label;cb.classList.toggle('hot',!!G.ctx.hot);}}
  const pr=$('prog');if(G.act){pr.hidden=false;$('progTxt').textContent=G.act.label;$('progBar').style.width=Math.min(100,G.act.t/G.act.need*100)+'%';}else pr.hidden=true;
  const gl=$('goal'),qa=$('qArrow'),qt=$('qTxt'),qd=$('qDist');gl.hidden=false;
  if(G.enc){qa.style.display='none';qt.textContent='Noch '+fighters.filter(f=>f.team==='E'&&f.state!=='dead').length+' Gegner';qd.textContent='';beacon.visible=false;}
  else if(G.mode==='sail'&&G.boss){qa.style.display='none';qt.textContent='Tiefenschlund: '+Math.max(0,Math.round(G.boss.hp/G.boss.maxhp*100))+' %';qd.textContent='';beacon.visible=false;}
  else{const q=questInfo(),t=q.tgt;qt.textContent=q.txt;
    if(t){const foot=G.mode==='foot'&&PF.fig,wp=foot?PF.fig.g.getWorldPosition(wtmp):null,px=foot?wp.x:P.x,pz=foot?wp.z:P.z,d=Math.hypot(t.x-px,t.z-pz);
      qa.style.display='';qa.style.transform='rotate('+angDiff(G.mode==='sail'?(G.seaYaw===undefined?P.ang:G.seaYaw):G.camYaw,Math.atan2(t.z-pz,t.x-px))+'rad)';qd.textContent=d>60?Math.round(d*2)+' m':'hier';
      beacon.visible=d>(t.r||12)+40;beacon.position.set(t.x,0,t.z);beacon.userData.ring.scale.setScalar(((t.r?t.r*1.15:(t.L||12))/6)*(1+Math.sin(G.t*3)*.05));}
    else{qa.style.display='none';qd.textContent='';beacon.visible=false;}}
  drawMini();
}
function numsFrame(dt){const w=innerWidth,h=innerHeight;for(const n of nums){n.life-=dt;n.p.y+=dt*2.5;tmp.copy(n.p).project(camera);
    if(tmp.z>1){n.el.style.display='none';continue;}n.el.style.display='';n.el.style.left=((tmp.x+1)/2*w)+'px';n.el.style.top=((1-tmp.y)/2*h)+'px';n.el.style.opacity=Math.min(1,n.life*2);}
  nums=nums.filter(n=>{if(n.life<=0){n.el.remove();return false;}return true;});}

function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.fov=h>w?68:56;camera.updateProjectionMatrix();if(composer)composer.setSize(w,h);}
addEventListener('resize',resize);
let last=performance.now();
function frame(t){
  requestAnimationFrame(frame);let dt=Math.min(.033,Math.max(0,(t-last)/1000));last=t;
  if(G.hitstop>0){G.hitstop-=dt;dt*=.08;}
  waterU.uTime.value=G.t;fallU.uT.value=G.t;falls.forEach(f=>{f.m.visible=(f.x===0?P.x:f.x===WORLD?WORLD-P.x:f.z===0?P.z:WORLD-P.z)<900;});
  if(G.state==='play')update(dt);
  else{G.t+=dt*(G.state==='modal'?.3:1);if(pship){poseShip(pship,P.x,P.z,P.ang,G.t,0,0);setSailFade(pship,G.state==='create'?.12:1);}enemies.forEach(e=>poseShip(e.sh,e.x,e.z,e.ang,G.t,0,e.sink));}
  for(const k in PS)PS[k].update(dt);updFx(dt);
  clouds.forEach(c=>{c.position.x+=dt*2.5;if(c.position.x>WORLD+300)c.position.x=-300;});
  if(A.ctx&&A.ctx.state==='running')music();
  const cx=G.mode==='foot'&&PF.fig?PF.fig.g.getWorldPosition(wtmp).x:P.x,cz=G.mode==='foot'&&PF.fig?wtmp.z:P.z;
  ocean.position.set(Math.round(cx/OSTEP)*OSTEP,0,Math.round(cz/OSTEP)*OSTEP);
  updCamera(dt);hudFrame(dt);numsFrame(dt);
  if(composer)composer.render();else renderer.render(scene,camera);
}
new MutationObserver(readTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',readTheme);
readTheme();resize();

[foamMat,iceMat,coinMat,cloudMat,named.sand,named.grass,named.leaf,...Object.values(ballMats)].forEach(m=>m.userData.cached=1);
S=loadSave()||newSave();migrate(S);genWorld(S.seed);buildPlayerShip();makePlayerFig();placeAtHelm();P.x=islands[0].x+Math.cos(islands[0].ka+Math.PI)*(islands[0].r+30);P.z=islands[0].z+Math.sin(islands[0].ka+Math.PI)*(islands[0].r+30);P.ang=islands[0].ka+Math.PI*1.5;
applyGfx();showStart();requestAnimationFrame(frame);
})();
